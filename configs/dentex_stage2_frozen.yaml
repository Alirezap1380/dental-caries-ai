# Stage 2 alone, on human tooth boxes: the first real number on DENTEX.
# Frozen ImageNet ResNet-50 features + multinomial logistic head, trained on the
# train partition only. Evaluation is restricted to the images with a human tooth
# inventory (enumeration-subset copies); stage 1 extends coverage later.
name: dentex_stage2_frozen_resnet50
seed: 20261009
n_boot: 2000
scale: dentex_depth

# Patient-level, over *recovered* patients (probes/recover_groups.py).
splits:
  train: 0.6
  val: 0.2
  test: 0.2

# Structured as: deployment role -> the asymmetry that follows -> chosen target ->
# what changes if the role changes. The code rejects autonomous_triage unless
# specificity is the binding constraint. See README "Operating point".
operating_point:
  deployment_role: second_reader
  constraint: sensitivity
  target: 0.80
  coverage_target: 0.85
  rationale: >-
    Deployment role: second reader. A dentist adjudicates every flag before
    anything is done to the tooth.
    Asymmetry: caries inverts the usual screening asymmetry. A missed early lesion
    is found later and restored instead of arrested, a bounded and partly
    recoverable harm. A false positive that is acted on drills sound tooth
    structure and starts the restorative cycle. In this role a false positive
    costs review time rather than tooth structure (residual risk: a flag can
    anchor the reviewer towards treatment), so sensitivity may bind.
    Target: sensitivity >= 0.80 against the consensus reference. This is
    provisional, to be re-anchored to the readers' own sensitivity once the
    agreement analysis runs on real data: a second reader far more sensitive
    than the readers mostly adds flags they will overrule.
    If the role changes to autonomous triage (a flag drives treatment),
    specificity becomes the binding constraint, its target is set first, and
    sensitivity becomes the reported cost.

detection:
  # DENTEX boxes are whole-tooth boxes. Model boxes come from the enumeration
  # subset and reference boxes from the diagnosis subset: two annotation layers
  # drawing the same tooth, so IoU 0.5 is a fair match criterion.
  iou_threshold: 0.5
  # A box's score is its tooth's P(lesion), so boxes are scored at the frozen
  # operating threshold, not at an unrelated constant.
  score_threshold: operating_point

headline_alpha: 0.05
